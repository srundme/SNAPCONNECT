services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snapsocial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-snapsocial}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snapsocial}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.2
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.35.1
    environment:
      NVIDIA_VISIBLE_DEVICES: void
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  redisdata:
  ollama:
